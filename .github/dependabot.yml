version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(github-actions)
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(npm)
  groups:
    react:
      patterns:
      - react
      - react-dom
      - '@types/react'
      - '@types/react-dom'
    next:
      patterns:
      - next
      - eslint-config-next
    eslint:
      patterns:
      - eslint
      - eslint-config-*
    testing:
      patterns:
      - vitest
      - '@vitejs/*'
      - '@testing-library/*'
      - jsdom
    tailwind:
      patterns:
      - tailwindcss
      - '@tailwindcss/*'
      - postcss
    types:
      patterns:
      - '@types/*'
